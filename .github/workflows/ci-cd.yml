name: CI/CD

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      extra_tag:
        description: Optional additional image tag (letters, digits, dot, dash, underscore)
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '24'

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.detect.outputs.code }}
      publish: ${{ steps.detect.outputs.publish }}
      extra_tag: ${{ steps.detect.outputs.extra_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        shell: bash
        env:
          EXTRA_TAG: ${{ inputs.extra_tag }}
        run: |
          set -euo pipefail
          code=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/changed.txt
            if ! grep -Ev '^(README\.md|docs/)' /tmp/changed.txt | grep -q .; then code=false; fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            before='${{ github.event.before }}'
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              git show --pretty='' --name-only HEAD > /tmp/changed.txt
            else
              git diff --name-only "$before" '${{ github.sha }}' > /tmp/changed.txt
            fi
            if ! grep -Ev '^(README\.md|docs/)' /tmp/changed.txt | grep -q .; then code=false; fi
          fi
          publish=false
          # Manual runs are build-only unless explicitly run from master.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref }}" = "refs/heads/master" ]; then publish=true; fi
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/master" ] && [ "$code" = "true" ]; then publish=true; fi
          tag="${EXTRA_TAG:-}"
          if [ -n "$tag" ] && ! printf '%s' "$tag" | grep -Eq '^[A-Za-z0-9._-]{1,128}$'; then
            echo 'extra_tag contains invalid characters' >&2
            exit 1
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "extra_tag=$tag" >> "$GITHUB_OUTPUT"

  backend-test:
    name: Backend checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - name: Install full test dependencies
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          Path('requirements-ci.txt').write_text(
              Path('requirements.txt').read_text(encoding='utf-16'), encoding='utf-8'
          )
          PY
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
      - name: Run isolated checks
        shell: bash
        working-directory: backend
        run: |
          set -o pipefail
          python -m django test tests.test_auth --settings=tests.auth_settings --verbosity=1 2>&1 | tee ../backend-auth.log
          python manage.py check --settings=tests.auth_settings 2>&1 | tee ../backend-check.log
      - name: Run configuration tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s backend/tests -p 'test_env_config.py' -v 2>&1 | tee backend-config.log
          python -m unittest discover -s backend/tests -p 'test_deploy_runtime.py' -v 2>&1 | tee backend-deploy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-ci-logs-${{ github.run_id }}
          path: backend-*.log
          if-no-files-found: warn
          retention-days: 7

  frontend-test:
    name: Frontend checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and test
        shell: bash
        working-directory: frontend
        run: |
          set -o pipefail
          npm ci 2>&1 | tee ../frontend-install.log
          node --test tests/auth.test.mjs tests/config.test.mjs 2>&1 | tee ../frontend-test.log
      - name: Build frontend
        shell: bash
        working-directory: frontend
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ../frontend-build.log
          test -f dist/index.html
          test -f dist/models/d51675667acfc8a42b8e40d4c3e9799a.glb
          test -f dist/models/vad/silero_vad_legacy.onnx
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.run_id }}
          path: frontend/dist
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-ci-logs-${{ github.run_id }}
          path: frontend-*.log
          if-no-files-found: warn
          retention-days: 7

  backend-image:
    name: Backend image
    needs: [changes, backend-test]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate demo Compose configuration
        working-directory: deploy
        env:
          ACR_REGISTRY: crpi-gbihc3e57h3o3f2l.cn-hangzhou.personal.cr.aliyuncs.com
          ACR_NAMESPACE: tencent-ubutun22
          SECRET_KEY: ci-compose-only-key
          DOCKER_CONFIG_DIR: /tmp/ci-docker-config
        run: |
          set -euo pipefail
          docker compose --env-file /dev/null config --format json > /tmp/demo-compose.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          services = json.loads(Path('/tmp/demo-compose.json').read_text())['services']
          assert services['backend']['environment']['DJANGO_SETTINGS_MODULE'] == 'cs_career_guide.settings_sqlite'
          watchtower = services['watchtower']
          assert watchtower['network_mode'] == 'bridge'
          assert watchtower['environment']['DOCKER_CONFIG'] == '/config'
          assert not watchtower.get('ports')
          assert any(mount['target'] == '/config' and mount.get('read_only') for mount in watchtower['volumes'])
          assert not services['mysql']['environment']['MYSQL_PASSWORD']
          assert not services['mysql']['environment']['MYSQL_ROOT_PASSWORD']
          print('Demo Compose validated: SQLite default, optional MySQL, Watchtower registry access and credential path.')
          PY
      - uses: docker/setup-buildx-action@v3
      - name: Resolve image coordinates
        shell: bash
        run: |
          set -euo pipefail
          publish='${{ needs.changes.outputs.publish }}'
          if [ "$publish" = "true" ]; then
            registry='${{ vars.ACR_REGISTRY }}'
            namespace='${{ vars.ACR_NAMESPACE }}'
            if [ -z "$registry" ] || [ -z "$namespace" ]; then
              echo 'ACR_REGISTRY and ACR_NAMESPACE must be configured in repository Variables' >&2
              exit 1
            fi
            if ! printf '%s' "$registry" | grep -Eq '^[a-z0-9.-]+(:[0-9]+)?$'; then
              echo 'ACR_REGISTRY must be a registry hostname without a URL scheme or path' >&2
              exit 1
            fi
            if ! printf '%s' "$namespace" | grep -Eq '^[a-z0-9][a-z0-9-]*$'; then
              echo 'ACR_NAMESPACE contains invalid characters' >&2
              exit 1
            fi
            image="$registry/$namespace/cs-career-guide-backend"
          else
            image='cs-career-guide-backend'
          fi
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          tag='${{ needs.changes.outputs.extra_tag }}'
          tags="$image:latest"$'\n'"$image:sha-${GITHUB_SHA::7}"
          if [ -n "$tag" ]; then tags="$tags"$'\n'"$image:$tag"; fi
          {
            echo 'BACKEND_TAGS<<EOF'
            echo "$tags"
            echo 'EOF'
          } >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        if: needs.changes.outputs.publish == 'true'
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          platforms: linux/amd64
          push: ${{ needs.changes.outputs.publish == 'true' }}
          load: ${{ needs.changes.outputs.publish != 'true' }}
          tags: ${{ env.BACKEND_TAGS }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=cs-career-guide-backend
          cache-to: type=gha,mode=max,scope=cs-career-guide-backend
      - name: Smoke test build-only image
        if: needs.changes.outputs.publish != 'true'
        shell: bash
        run: |
          set -euo pipefail
          container="backend-smoke-${GITHUB_RUN_ID}"
          docker run -d --name "$container" \
            -e SECRET_KEY=ci-only-key \
            -e ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e DJANGO_SETTINGS_MODULE=cs_career_guide.settings_sqlite \
            -e DB_PATH=/tmp/cs-career-guide.sqlite3 \
            -e STATIC_ROOT=/tmp/staticfiles \
            -e MEDIA_ROOT=/tmp/media \
            -e LANCEDB_PATH=/tmp/lancedb \
            "$IMAGE:sha-${GITHUB_SHA::7}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 90); do
            status="$(docker inspect --format '{{.State.Status}}' "$container")"
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container")"
            if [ "$status" = "exited" ] || [ "$health" = "unhealthy" ]; then
              docker logs "$container"
              exit 1
            fi
            if [ "$health" = "healthy" ]; then
              docker logs "$container"
              exit 0
            fi
            sleep 2
          done
          docker logs "$container"
          echo 'Backend container did not become healthy within 180 seconds' >&2
          exit 1

  frontend-image:
    name: Frontend image
    needs: [changes, frontend-test]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Resolve image coordinates
        shell: bash
        run: |
          set -euo pipefail
          publish='${{ needs.changes.outputs.publish }}'
          if [ "$publish" = "true" ]; then
            registry='${{ vars.ACR_REGISTRY }}'
            namespace='${{ vars.ACR_NAMESPACE }}'
            if [ -z "$registry" ] || [ -z "$namespace" ]; then
              echo 'ACR_REGISTRY and ACR_NAMESPACE must be configured in repository Variables' >&2
              exit 1
            fi
            image="$registry/$namespace/cs-career-guide-frontend"
          else
            image='cs-career-guide-frontend'
          fi
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          tag='${{ needs.changes.outputs.extra_tag }}'
          tags="$image:latest"$'\n'"$image:sha-${GITHUB_SHA::7}"
          if [ -n "$tag" ]; then tags="$tags"$'\n'"$image:$tag"; fi
          {
            echo 'FRONTEND_TAGS<<EOF'
            echo "$tags"
            echo 'EOF'
          } >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        if: needs.changes.outputs.publish == 'true'
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          platforms: linux/amd64
          push: ${{ needs.changes.outputs.publish == 'true' }}
          load: ${{ needs.changes.outputs.publish != 'true' }}
          tags: ${{ env.FRONTEND_TAGS }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=cs-career-guide-frontend
          cache-to: type=gha,mode=max,scope=cs-career-guide-frontend
      - name: Smoke test build-only image
        if: needs.changes.outputs.publish != 'true'
        shell: bash
        run: |
          set -euo pipefail
          network="frontend-smoke-network-${GITHUB_RUN_ID}"
          backend="frontend-smoke-backend-${GITHUB_RUN_ID}"
          container="frontend-smoke-${GITHUB_RUN_ID}"
          docker network create "$network" >/dev/null
          docker run -d --name "$backend" --network "$network" --network-alias backend \
            python:3.11-alpine python -m http.server 8000 >/dev/null
          docker run -d --name "$container" --network "$network" -p 18080:80 \
            "$IMAGE:sha-${GITHUB_SHA::7}" >/dev/null
          trap 'docker rm -f "$container" "$backend" >/dev/null 2>&1 || true; docker network rm "$network" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/ >/dev/null 2>&1; then break; fi
            status="$(docker inspect --format '{{.State.Status}}' "$container")"
            if [ "$status" = "exited" ]; then
              docker inspect "$container" --format '{{json .State}}'
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:18080/ >/dev/null 2>&1; then
            docker inspect "$container" --format '{{json .State}}'
            docker logs "$container"
            echo 'Frontend container did not start serving HTTP' >&2
            exit 1
          fi
          curl -fsS http://127.0.0.1:18080/ | grep -q '<div id="app"></div>'
          curl -fsS http://127.0.0.1:18080/login | grep -q '<div id="app"></div>'
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/)" = 404
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/company-api)" = 503
          curl -fsS http://127.0.0.1:18080/models/vad/silero_vad_legacy.onnx -o /dev/null
          curl -fsS http://127.0.0.1:18080/models/d51675667acfc8a42b8e40d4c3e9799a.glb -o /dev/null

  release-summary:
    name: Release summary
    needs: [changes, backend-image, frontend-image]
    if: always() && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Write summary
        shell: bash
        run: |
          if [ '${{ needs.backend-image.result }}' != 'success' ] || [ '${{ needs.frontend-image.result }}' != 'success' ]; then
            echo 'Image jobs did not both succeed.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ '${{ needs.changes.outputs.publish }}' != 'true' ]; then
            echo 'Build-only validation passed; no registry push was performed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          registry='${{ vars.ACR_REGISTRY }}'
          namespace='${{ vars.ACR_NAMESPACE }}'
          short_sha="${GITHUB_SHA::7}"
          {
            echo '## Published images'
            echo
            echo "- \`$registry/$namespace/cs-career-guide-backend:latest\`"
            echo "- \`$registry/$namespace/cs-career-guide-backend:sha-$short_sha\`"
            echo "- \`$registry/$namespace/cs-career-guide-frontend:latest\`"
            echo "- \`$registry/$namespace/cs-career-guide-frontend:sha-$short_sha\`"
            echo
            echo 'Server pull: `cd deploy && docker compose pull && docker compose up -d --no-build`'
          } >> "$GITHUB_STEP_SUMMARY"
